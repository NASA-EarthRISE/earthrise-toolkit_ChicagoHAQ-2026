{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}Regional Ozone Precursor Dashboard{% endblock %}</title>
    <!-- Base Layout Styling CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'dashboard/css/layout.css' %}"/>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!--  Navigation Bar -->
    <nav>
        {% include 'dashboard/includes/navbar.html' %}
    </nav>

    <!-- App Body -->
    <div class="app-body">
        <!-- Main Content Area -->
        <main class="content" id="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Footer -->
    <hr/>
    <footer>
        {% include 'dashboard/includes/footer.html' %}
    </footer>

    <!-- Toast Notification  -->
    <div id="toast"></div>

    <!-- Navigation Bar JS -->
    <script src = "{% static 'dashboard/js/navbar.js' %}"></script>
    <script>
        // Toast notification
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
