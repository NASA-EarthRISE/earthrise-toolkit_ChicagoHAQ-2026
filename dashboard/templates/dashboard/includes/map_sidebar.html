{% load static %}

<div class="sidebar-section">
    <h3>Region</h3>
    <div class="form-group" style="margin-bottom:0;">
      <select id="region-dropdown">
        <option value="">Select a region...</option>
        <option value="cook_county">Cook County, Chicago</option>
      </select>
    </div>
</div>

<div class="sidebar-section">
    <h3>Observation Window</h3>
    <div class="map-type-grid">
        <button class="map-type-btn {% if time_scale == 'hourly' %}active{% endif %}" style = "background-color: var(--warning)" data-type="hourly" data-url="{% url 'map_hourly' %}" onclick="handleMapTypeClick(event, 'hourly');">Hourly</button>
        <button class="map-type-btn {% if time_scale == 'daily' %}active{% endif %}" style = "background-color: var(--success)" data-type="daily" data-url="{% url 'map_daily' %}" onclick="handleMapTypeClick(event, 'daily');">Daily</button>
        <button class="map-type-btn {% if time_scale == 'monthly' %}active{% endif %}" style = "background-color: var(--primary-light)" data-type="monthly" data-url="{% url 'map_monthly' %}" onclick="handleMapTypeClick(event, 'monthly');">Monthly</button>
    </div>
</div>

<div class = "sidebar-section" style="background-color:var(--primary-dark);">
    <!-- Date Selection (only for hourly) -->
    <div class="form-group" id="single-date-group">
      <label for="map-date">Select Date</label>
      <input type="date" id="map-date" value="{{ today|date:'Y-m-d' }}" />
    </div>

    <!-- Date Range Selection (only for daily) -->
    <div id="date-range-group" style="display: none;">
      <div class="form-row">
        <div class="form-group">
          <label for="date-range-start">Start Date</label>
          <input type="date" id="date-range-start" value="{{ today|date:'Y-m-d' }}" />
        </div>
        <div class="form-group">
          <label for="date-range-end">End Date</label>
          <input type="date" id="date-range-end" value="{{ today|date:'Y-m-d' }}" />
        </div>
    </div>
    </div>

    <!-- Month Range Selection (only for monthly) -->
    <div id="month-range-group" style="display: none;">
      <div class="form-row">
        <div class="form-group">
          <label for="month-range-start">Start Month</label>
          <input type="month" id="month-range-start" value="{{ today|date:'Y-m' }}" />
        </div>
        <div class="form-group">
          <label for="month-range-end">End Month</label>
          <input type="month" id="month-range-end" value="{{ today|date:'Y-m' }}" />
        </div>
      </div>
    </div>

  </div>

<div class="sidebar-section">
    <h3>Data Products</h3>
    <div style="margin-bottom:.75rem;">
        <strong style="font-size:.82rem; color:var(--text-muted);">NO2 Concentration</strong>
        <label class="layer-item" style="display:block; margin-bottom:.4rem;">
            <input type="radio" name="dataProduct" value="tempo" checked /> TEMPO
        </label>
        <label class="layer-item" style="display:block; margin-bottom:.4rem;">
            <input type="radio" name="dataProduct" value="openaq" /> Open Air Chicago
        </label>
        <label class="layer-item" style="display:block; margin-bottom:.4rem;">
            <input type="radio" name="dataProduct" value="fusion" /> Fusion (TEMPO + Open Air Chicago)
        </label>
    </div>
  </div>

<div class="sidebar-section">
    <h3>Spatial Scale</h3>
    <div style="margin-bottom:.75rem;">
      <label class="layer-item" style="display:block; margin-bottom:.4rem;">
        <input type="radio" name="displayMode" value="sensor" checked /> Individual Sensors
      </label>
      <label class="layer-item" style="display:block; margin-bottom:.4rem;">
        <input type="radio" name="displayMode" value ="community" /> Community Areas
      </label>
    </div>
  </div>
