<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Leaflet Tiff File Example</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- geotiff.js (required to read TIFF/GeoTIFF files) -->
    <script src="https://unpkg.com/geotiff"></script>

    <!-- georaster + georaster-layer-for-leaflet -->
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
    <script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.js"></script>
    <script src="https://unpkg.com/georaster/dist/georaster.browser.bundle.min.js"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet/dist/georaster-layer-for-leaflet.min.js"></script>


    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
        #error-message { color: red; padding: 10px; }
    </style>
</head>

<body>

<div id="error-message"></div>
<div id="map"></div>

<script>

// Create Map
const map = L.map("map").setView([0, 0], 2);

// Basemap Layer
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19
}).addTo(map);


// Load GeoTIFF & Replace with  Tiff File URL
const tiffUrl = "C:/Users/ccmcclan/.vscode/hello_django/hello/vertical_column_troposphere_CopyRaster2.tif";  // <-- update this

async function loadGeoTiff(url) {
    try {
      
        const arrayBuffer = await response.arrayBuffer();
        const georaster = await parseGeoraster(arrayBuffer);

        // Create GeoRasterLayer
        const layer = new GeoRasterLayer({
            georaster,
            opacity: 0.75,
            resolution: 256  // Adjust for performance if needed
        });

        layer.addTo(map);

        // Fit map to raster bounds
        map.fitBounds(layer.getBounds());  
        
        if (typeof url !== "string" || !url.toLowerCase().endsWith(".tif") && !url.toLowerCase().endsWith(".tiff")) {
            throw new Error("Invalid TIFF URL. Must end with .tif or .tiff");
        }

        const response = await fetch(url);
        if (!response.ok) {
            throw new Error("Failed to fetch TIFF: " + response.statusText);
        }
    } 
    catch (error) {
        document.getElementById("error-message").textContent = 
            "Error loading TIFF: " + error.message;
        console.error(error);
    }
}

// Call function with URL provided above
loadGeoTiff(tiffUrl);
</script>

</body>
</html>
